services:
  config-injector:
    image: alpine:latest
    container_name: config-setup
    restart: "no"
    volumes:
      - ./config:/data/config
      - proxy-data:/proxy
      - limbo-data:/limbo
      - /source:/source:ro
      - ./mc-image-helper-custom:/usr/share/mc-image-helper
      - ./mc-image-helper-0.0.0-feat-hocon-support-SNAPSHOT.tgz:/mc-image-helper.tgz
    command: |
      /bin/sh -c '
      # --- Extract Custom MC Image Helper ---
      if [ ! -f /usr/share/mc-image-helper/bin/mc-image-helper ]; then
        echo "--> Extracting custom mc-image-helper..."
        tar -xzf /mc-image-helper.tgz -C /usr/share/mc-image-helper --strip-components=1
      fi

      echo "--> Starting Config Injection..."

      # --- Forwarding Secret ---
      echo "my-secure-secret" > /proxy/forwarding.secret

      # --- Velocity Config ---
      echo "--> Configuring Velocity..."
      cat > /proxy/velocity.toml << "VELOCITY_EOF"
      config-version = "2.7"
      bind = "0.0.0.0:25565"
      motd = "<#09add3>A Velocity Server"
      show-max-players = 500
      online-mode = false
      force-key-authentication = false
      prevent-client-proxy-connections = false
      player-info-forwarding-mode = "MODERN"
      forwarding-secret-file = "forwarding.secret"
      announce-forge = false
      kick-existing-players = false
      ping-passthrough = "DISABLED"
      enable-player-address-logging = true

      [servers]
      limbo = "limbo:25565"
      main = "backend:25565"
      try = ["limbo", "main"]

      [forced-hosts]

      [advanced]
      compression-threshold = 256
      compression-level = -1
      login-ratelimit = 3000
      connection-timeout = 5000
      read-timeout = 30000
      haproxy-protocol = false
      tcp-fast-open = false
      bungee-plugin-message-channel = true
      show-ping-requests = false
      failover-on-unexpected-server-disconnect = true
      announce-proxy-commands = true
      log-command-executions = false
      log-player-connections = true
      accepts-transfers = false

      [query]
      enabled = false
      port = 25577
      map = "Velocity"
      show-plugins = false
      VELOCITY_EOF

      # --- AgarthaLogin Config ---
      echo "--> Configuring AgarthaLogin..."
      mkdir -p /proxy/plugins/librelogin
      cat > /proxy/plugins/librelogin/config.conf << "AGARTHA_EOF"
      revision = 8
      database {
          type = "librelogin-mysql"
          properties {
              mysql {
                  host = "agartha-db"
                  port = 3306
                  database = "librelogin"
                  username = "admin"
                  password = "password"
              }
          }
      }

      web-server {
          enabled = true
          port = 8080
          public-url = "http://localhost:8080"
      }

      redis {
          enabled = false
      }

      limbo = [
          "limbo"
      ]

      lobby {
          root = [
              "main"
          ]
      }
      AGARTHA_EOF

      # --- Backend Patch (Paper velocity forwarding) ---
      echo "--> Creating backend patch..."
      mkdir -p /backend/patches
      cat > /backend/patches/velocity.json << "PATCH_EOF"
      {
        "patches": [
          {
            "file": "/data/config/paper-global.yml",
            "ops": [
              { "$$set": { "path": "$.proxies.velocity.enabled", "value": true, "value-type": "bool" } },
              { "$$set": { "path": "$.proxies.velocity.online-mode", "value": false, "value-type": "bool" } },
              { "$$set": { "path": "$.proxies.velocity.secret", "value": "my-secure-secret" } }
            ]
          }
        ]
      }
      PATCH_EOF

      # --- Limbo Config (Pre-seed) ---
      echo "--> Pre-seeding Limbo settings.yml..."
      cat > /limbo/settings.yml << "LIMBO_EOF"
      bind:
        ip: 0.0.0.0
        port: 25565
      maxPlayers: 100
      ping:
        description: "{\"text\": \"&9NanoLimbo\"}"
        version: NanoLimbo
        protocol: -1
      dimension: THE_END
      playerList:
        enable: false
        username: NanoLimbo
      headerAndFooter:
        enable: false
        header: "{\"text\": \"&eWelcome!\"}"
        footer: "{\"text\": \"&9NanoLimbo\"}"
      gameMode: 3
      secureProfile: false
      brandName:
        enable: true
        content: NanoLimbo
      joinMessage:
        enable: true
        text: "{\"text\": \"&eWelcome to the Limbo!\"}"
      bossBar:
        enable: true
        text: "{\"text\": \"Welcome to the Limbo!\"}"
        health: 1.0
        color: PINK
        division: SOLID
      title:
        enable: true
        title: "{\"text\": \"&9&lWelcome!\"}"
        subtitle: "{\"text\": \"&6NanoLimbo\"}"
        fadeIn: 10
        stay: 100
        fadeOut: 10
      infoForwarding:
        type: NONE
        secret: ''
        tokens: []
      readTimeout: 30000
      debugLevel: 2
      netty:
        useEpoll: true
        threads:
          bossGroup: 1
          workerGroup: 4
      traffic:
        enable: true
        maxPacketSize: 8192
        interval: 7.0
        maxPacketRate: 500.0
        maxPacketBytesRate: 2048.0
      LIMBO_EOF
      chown 1000:1000 /limbo/settings.yml

      # --- Install AgarthaLogin Plugin ---
      echo "--> Installing AgarthaLogin..."
      LATEST_JAR=$(ls -t /source/AgarthaLogin-*.jar 2>/dev/null | head -1)
      if [ -n "$$LATEST_JAR" ]; then
        cp "$$LATEST_JAR" /proxy/plugins/AgarthaLogin.jar
        chmod 644 /proxy/plugins/AgarthaLogin.jar
        echo "Installed: $$LATEST_JAR"
      else
        echo "WARNING: No AgarthaLogin JAR found in /source"
      fi

      echo "--> Configuration Injection Complete."
      '

  db:
    image: mariadb:10.11
    container_name: agartha-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_DATABASE: "librelogin"
      MYSQL_USER: "admin"
      MYSQL_PASSWORD: "password"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: itzg/mc-proxy:latest
    container_name: velocity-proxy
    restart: always
    ports:
      - "25565:25565"
      - "8080:8080"
    depends_on:
      config-injector:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      TYPE: "VELOCITY"
      MINECRAFT_VERSION: "1.21.1"

    volumes:
      - proxy-data:/server

  limbo:
    image: itzg/minecraft-server:java21
    container_name: limbo-server
    restart: always
    environment:
      SERVER_PORT: "25565"
      TYPE: "NANOLIMBO"
      MINECRAFT_VERSION: "1.21.1"
      EULA: "TRUE"
      PATCHES: "/data/patches"
    volumes:
      - limbo-data:/data
      - ./mc-image-helper-custom:/usr/share/mc-image-helper
      - ./nanolimbo-settings-patch.json:/image/nanolimbo-settings-patch.json
    depends_on:
      config-injector:
        condition: service_completed_successfully

  backend:
    image: itzg/minecraft-server:java21-alpine
    container_name: backend-server
    restart: always
    environment:
      TYPE: "PURPUR"
      MINECRAFT_VERSION: "1.21.1"
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      OPS: "akippnn"

      PATCHES: "/data/patches"
    volumes:
      - backend-data:/data
      - ./mc-image-helper-custom:/usr/share/mc-image-helper
    depends_on:
      config-injector:
        condition: service_completed_successfully

volumes:
  db-data:
  proxy-data:
  limbo-data:
  backend-data:
