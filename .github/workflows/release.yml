name: Release

on:
  release:
    types: [ published ]
  workflow_run:
    workflows: [ "Java CI with Gradle" ]
    types: [ completed ]
    branches: [ "feature/web-auth" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Only run if: triggered by release/dispatch, OR workflow_run succeeded
    if: |
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Generate Locales
        run: ./gradlew generateLocales

      - name: Get release tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            # Remove 'v' prefix if present
            VERSION=${TAG#v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # For workflow_run events (after CI passes), parse version from gradle.properties
            VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
            TAG="v$VERSION"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
            
            # Check if tag already exists
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists, skipping release."
              echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
            else
              echo "Tag $TAG does not exist, proceeding with release."
              echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
            fi
          else
            # For manual dispatch, get the latest tag
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            VERSION=${LATEST_TAG#v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "RELEASE_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if tag exists
        if: steps.get_version.outputs.TAG_EXISTS == 'true'
        run: echo "Tag already exists, skipping build and release."

      - name: Build shadow JAR
        if: steps.get_version.outputs.TAG_EXISTS != 'true'
        run: ./gradlew shadowJar -PprodVersion=${{ steps.get_version.outputs.VERSION }}

      - name: Find JARs containing release tag
        if: steps.get_version.outputs.TAG_EXISTS != 'true'
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          # Clean version (remove 'v' prefix if present) - Redundant but safe
          CLEAN_VERSION=${VERSION#v}
          
          # Create release directory
          mkdir -p release-assets
          
          echo "Looking for JAR files containing version: $CLEAN_VERSION"
          
          # Find all JAR files in build/libs directories and the custom target directory
          find . \( -path "*/build/libs/*.jar" -o -path "./target/*.jar" \) -type f | while read jar; do
            basename=$(basename "$jar")
          
            # Check if the JAR filename contains the version tag
            if [[ "$basename" == *"$CLEAN_VERSION"* ]]; then
              echo "Found matching JAR: $jar"
              cp "$jar" "release-assets/"
            else
              echo "Skipping JAR (no version match): $jar"
            fi
          done

      - name: List release assets
        if: steps.get_version.outputs.TAG_EXISTS != 'true'
        run: |
          echo "Release assets found:"
          ls -la release-assets/

      - name: Upload JARs to release (for release trigger)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.jar
          tag_name: ${{ steps.get_version.outputs.RELEASE_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag and release (for workflow_run trigger)
        if: github.event_name == 'workflow_run' && steps.get_version.outputs.TAG_EXISTS != 'true'
        run: |
          TAG="${{ steps.get_version.outputs.RELEASE_TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JARs to new release (for workflow_run trigger)
        if: github.event_name == 'workflow_run' && steps.get_version.outputs.TAG_EXISTS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.RELEASE_TAG }}
          name: Release ${{ steps.get_version.outputs.RELEASE_TAG }}
          files: release-assets/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JARs using GitHub CLI (for manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.get_version.outputs.RELEASE_TAG }}"
          
          # Check if release exists, create if it doesn't
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Creating release $TAG..."
            gh release create "$TAG" --title "Release $TAG" --notes "Manually triggered release"
          fi
          
          # Upload all JAR files
          for jar in release-assets/*.jar; do
            if [ -f "$jar" ]; then
              echo "Uploading $jar to release $TAG..."
              gh release upload "$TAG" "$jar"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
